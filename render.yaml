services:
  - type: web
    name: payguard-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @payguard/contracts run build && pnpm --filter @payguard/api run build
    startCommand: pnpm --filter @payguard/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # CSV allowed: one webhook id per subscribed event type.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Auth is mandatory: set a CSV of apiKey:ownerId pairs in the Render
      # dashboard. The API refuses to boot without it (fail closed).
      - key: PAYGUARD_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false

