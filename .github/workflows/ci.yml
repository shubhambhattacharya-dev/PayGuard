name: PayGuard Production CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: payguard_ci_password
          POSTGRES_DB: payguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payguard -d payguard_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript Compilation
        run: pnpm run build

      - name: Run Vitest Unit & Invariant Tests
        env:
          DATABASE_URL: postgres://payguard:payguard_ci_password@127.0.0.1:5432/payguard_db
        run: pnpm run test

      - name: Run Golden Eval Harness (18 adversarial cases)
        run: pnpm run eval

      - name: Verify Web Next.js Build
        run: pnpm --filter @payguard/web run build